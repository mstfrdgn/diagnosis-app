# ─────────────────────────────────────────────
# Diagnostic App – Default Bundled Config
# Copy to your app data folder to customise.
# ─────────────────────────────────────────────

app:
  title: "Medical Diagnosis Assistant"
  version: "1.1.0"
  theme: light

backend:
  host: "127.0.0.1"
  # fixed_port: 8765   # Optional: always use this port (default: a free one)
  startup_timeout_seconds: 15

model:
  default_path: ""

result_display:
  show_probability: true
  probability_format: "percent"

evaluation_dialog:
  enabled: true
  field_order:
    - doctor_diagnosis
    - notes
  doctor_diagnosis_options:
    - "Positive"
    - "Negative"
    - "Uncertain"
  auto_open_after_result: true

csv_logging:
  enabled: true
  output_path: "sessions.csv"
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  include_probability: true
  include_doctor_diagnosis: true
  include_notes: true

form:
  missing_value_token: "?"
  show_tooltips: true
  show_range_hints: true
