name: diagnostic_app
description: A configurable medical diagnosis desktop application.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # REST calls to the local FastAPI backend
  http: ^1.2.0

  # Parse app_config.yaml
  yaml: ^3.1.2

  # Native file picker for .pkcls model files
  file_picker: ^8.0.0

  # CSV session logging
  csv: ^5.1.1

  # App documents / cache directory
  path_provider: ^2.1.3

  # Platform-safe path joining
  path: ^1.9.0

  # SHA256 check of the bundled backend before it is unpacked
  crypto: ^3.0.6

  # ChangeNotifier-based state management
  provider: ^6.1.2

  # Declarative routing
  go_router: ^14.0.0
  excel: ^4.0.6
  archive: 3.6.1

  # App version shown on the Settings screen
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/app_config.yaml
    - assets/backend/diagnostic_backend.zip
    - assets/backend/diagnostic_backend.sha256
